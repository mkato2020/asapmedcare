# Netlify deploy config — static site, no build step.

[build]
  publish = "."

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

# ---- Caching ----
# Fingerprint these filenames (styles.abc123.css) before raising max-age,
# otherwise a year-long cache will strand visitors on an old stylesheet.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Branded short links ----
# Share asapmedcare.co.ug/google instead of a 400-character Google URL.
# Targets can be changed here without reprinting anything.

[[redirects]]
  from = "/google"
  to = "https://www.google.com/search?q=ASAP+MedCare+(U)+Ltd&stick=H4sIAAAAAAAA_-NgU1I1qDA0N09JMjS3NEw2M7YwMzS3MqhINElLTTMxNUuySDE0NUxNXMQq4hjsGKDgm5rinFiUqqARqqngU5ICAHv2BHhAAAAA"
  status = 302
  force = true

[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/256743577838"
  status = 302
  force = true
